<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0618">
<title>Neon Serpent AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0a0618; }
  body { position:fixed; inset:0; width:100%; touch-action:none; user-select:none; -webkit-user-select:none; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #c { display:block; width:100%; height:100%; }
  #mute { position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); right:12px; z-index:10;
    width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,.18);
    background:rgba(10,12,26,.55); color:#cfd6ff; font-size:17px; cursor:pointer; backdrop-filter:blur(6px); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="mute">♪</button>
<script>
"use strict";
/* Neon Serpent — Snake reimagined. You start as one serpent. Eat the first
   orb and it SPLITS into two: cyan and magenta. One swipe steers both —
   magenta mirrors you left-for-right. Food spawns in mirrored pairs; eating
   grows both snakes. Keep both alive. Death is always your fault. */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
addEventListener('resize', resize);
cv.oncontextmenu=e=>e.preventDefault();

// ---------- audio ----------
let AC=null, muted=false, masterGain=null;
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=AC.createGain(); masterGain.gain.value=0.45; masterGain.connect(AC.destination); } return AC; }
function tone(freq,dur,type,vol,slide){
  if(muted) return; const ac=audio(); if(ac.state==='suspended') ac.resume();
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
  o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.4,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+dur+0.05); }
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
function playEat(combo){ const s=PENTA[Math.min(combo,PENTA.length-1)];
  tone(523.25*Math.pow(2,s/12),0.22,'sine',0.4);
  tone(1046.5*Math.pow(2,s/12),0.14,'sine',0.16); }
function playSplit(){ tone(180,0.5,'sawtooth',0.3,1400); tone(1200,0.4,'sine',0.2,2400);
  tone(90,0.5,'triangle',0.25,700); }
function playTurn(){ tone(660,0.04,'square',0.05); }
function playDeath(){ if(muted) return; const ac=audio(); if(ac.state==='suspended') ac.resume();
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
  o.type='sawtooth'; o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(40,t+0.5);
  g.gain.setValueAtTime(0.45,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+0.6); }
function playHazardWarn(){ tone(880,0.08,'square',0.12,660); }
function suspendAudio(){ if(AC && AC.state==='running') AC.suspend(); }
function resumeAudio(){ if(AC && AC.state==='suspended' && !muted) AC.resume(); }
document.addEventListener('visibilitychange', ()=> document.hidden ? suspendAudio() : resumeAudio());
addEventListener('blur', suspendAudio); addEventListener('focus', resumeAudio);
addEventListener('pagehide', suspendAudio);
document.getElementById('mute').onclick=e=>{ e.stopPropagation(); muted=!muted;
  document.getElementById('mute').textContent = muted?'✕':'♪';
  if(muted) suspendAudio(); else resumeAudio(); };
document.getElementById('mute').addEventListener('pointerdown', e=> e.stopPropagation());

// ---------- layout / grid ----------
const COLS=13, ROWS=19;
let GW=0, GX=0, CELL=0, FY=0, FH=0;
function layout(){ GW=Math.min(W,480); GX=(W-GW)/2;
  CELL=Math.floor(GW/COLS); FH=CELL*ROWS;
  FY=104+Math.max(0,(H-104-FH-56)/2); }

// ---------- state ----------
const BEST_KEY='neonserpent_best';
let best=parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0;
let mode='menu'; // menu | play | over
let score=0, combo=0, comboT=0, shakeT=0, flashT=0, splitPause=0, elapsed=0;
let snakes=[], foods=[], hazards=[], particles=[], floaters=[], stars=[];
let tickMs=175, tickAcc=0, growPending=0, hazardT=0;
let dirQueue=[];
let splitDone=false;

const DIRS={ up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
function mirrorDir(d){ return {x:-d.x, y:d.y}; } // mirror across the vertical axis
function sameDir(a,b){ return a.x===b.x && a.y===b.y; }
function oppDir(a,b){ return a.x===-b.x && a.y===-b.y; }

function fitFont(text, base, maxW, weight){ ctx.font=`${weight||700} ${base}px system-ui,sans-serif`;
  const w=ctx.measureText(text).width; if(w>maxW) return base*(maxW/w); return base; }
function lerp(a,b,t){ return a+(b-a)*t; }
function cellCX(cx){ return GX+cx*CELL+CELL/2; }
function cellCY(cy){ return FY+cy*CELL+CELL/2; }
function inBounds(x,y){ return x>=0 && x<COLS && y>=0 && y<ROWS; }
function occupied(x,y){
  for(const s of snakes) for(const seg of s.body) if(seg.x===x&&seg.y===y) return true;
  for(const f of foods) if(f.x===x&&f.y===y) return true;
  for(const h of hazards) if(h.x===x&&h.y===y) return true;
  return false;
}
function speedMs(){ return Math.max(95, 175 - score*2.2); }

function makeStars(){
  stars=[]; const n=Math.floor(GW*H/14000);
  for(let i=0;i<n;i++) stars.push({x:Math.random()*W, y:Math.random()*H,
    r:0.5+Math.random()*1.4, tw:Math.random()*6.28});
}
function makeSnake(x,y,dir,color,glow,len){
  const body=[]; for(let i=0;i<len;i++) body.push({x:x-dir.x*i, y:y-dir.y*i});
  return { color:color, glow:glow, dir:{x:dir.x,y:dir.y}, body:body,
    prev:body.map(s=>({x:s.x,y:s.y})) };
}
function reset(){
  makeStars();
  snakes=[ makeSnake(6,9,DIRS.right,'#22e6ff','#22e6ff',4) ];
  foods=[]; hazards=[]; particles=[]; floaters=[];
  score=0; combo=0; comboT=0; shakeT=0; flashT=0; splitPause=0; elapsed=0;
  tickMs=speedMs(); tickAcc=0; growPending=0; hazardT=0; dirQueue=[]; splitDone=false;
  spawnFoodPair();
}
function startGame(){ reset(); mode='play'; }

function spawnFoodPair(){
  // mirrored pair, never on the center column, never near either head
  for(let tries=0; tries<60; tries++){
    const x=1+Math.floor(Math.random()*5); // 1..5, mirror 11..7
    const y=1+Math.floor(Math.random()*(ROWS-2));
    const mx=COLS-1-x;
    if(occupied(x,y)||occupied(mx,y)) continue;
    let near=false;
    for(const s of snakes){ const h=s.body[0];
      if(Math.abs(h.x-x)+Math.abs(h.y-y)<3 || Math.abs(h.x-mx)+Math.abs(h.y-y)<3){ near=true; break; } }
    if(near) continue;
    foods=[ {x:x,y:y,ph:Math.random()*6.28}, {x:mx,y:y,ph:Math.random()*6.28} ];
    return;
  }
  // fallback: any two empty cells
  const empty=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(!occupied(x,y)) empty.push({x:x,y:y});
  if(empty.length>=2){ foods=[empty[0], empty[empty.length-1]]; }
  else foods=[];
}
function spawnHazardPair(){
  if(score<10 || hazards.length>0) return;
  for(let tries=0; tries<40; tries++){
    const x=1+Math.floor(Math.random()*5);
    const y=1+Math.floor(Math.random()*(ROWS-2));
    const mx=COLS-1-x;
    if(occupied(x,y)||occupied(mx,y)) continue;
    let near=false;
    for(const s of snakes){ const h=s.body[0];
      if(Math.abs(h.x-x)+Math.abs(h.y-y)<4 || Math.abs(h.x-mx)+Math.abs(h.y-y)<4){ near=true; break; } }
    if(near) continue;
    hazards=[ {x:x,y:y,life:8}, {x:mx,y:y,life:8} ];
    playHazardWarn();
    return;
  }
}
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, s=(0.2+Math.random()*0.8)*spd;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:0.5+Math.random()*0.4, r:1.5+Math.random()*2.5, c:color}); }
}

function doSplit(){
  splitDone=true; growPending=0;
  const len=4;
  // parallel lanes: cyan upper lane moving right, magenta lower lane moving
  // left. Never on a collision course after the split; the player chooses
  // when (and whether) to bring them together.
  const cyan=makeSnake(3,6,DIRS.right,'#22e6ff','#22e6ff',len);
  const mag=makeSnake(9,12,DIRS.left,'#ff4fd8','#ff4fd8',len);
  snakes=[cyan,mag];
  foods=[]; spawnFoodPair();
  flashT=0.3; shakeT=0.2; splitPause=0.35;
  playSplit();
  if(navigator.vibrate) try{ navigator.vibrate([30,40,30]); }catch(e){}
  burst(cellCX(6),cellCY(9),'255,255,255',26,GW*0.7);
  burst(cellCX(3),cellCY(6),'34,230,255',16,GW*0.5);
  burst(cellCX(9),cellCY(12),'255,79,216',16,GW*0.5);
  floaters.push({text:'SPLIT!', x:GX+GW/2, y:FY+FH*0.4, life:1.2, c:'#ffffff'});
}

function die(cause){
  if(mode!=='play') return;
  mode='over'; playDeath();
  if(navigator.vibrate) try{ navigator.vibrate([60,40,60]); }catch(e){}
  shakeT=0.45; flashT=0.25;
  for(const s of snakes){ const h=s.body[0];
    burst(cellCX(h.x),cellCY(h.y), s.color==='#22e6ff'?'34,230,255':'255,79,216', 22, GW*0.8); }
  if(score>best){ best=score; localStorage.setItem(BEST_KEY,String(best)); }
}

function queueDir(name){
  if(mode!=='play') return; // buffered even during the split flash; applied on the next tick
  const d=DIRS[name]; if(!d) return;
  const cur=snakes[0].dir;
  const lastQ=dirQueue.length?dirQueue[dirQueue.length-1]:cur;
  if(sameDir(d,lastQ) || oppDir(d,lastQ)) return; // no reverse, no duplicate
  if(dirQueue.length<2) dirQueue.push(d);
  playTurn();
}

function step(){
  // apply one buffered direction
  if(dirQueue.length){
    const d=dirQueue.shift();
    snakes[0].dir={x:d.x,y:d.y};
    if(snakes[1]) snakes[1].dir=mirrorDir(d);
  }
  tickMs=speedMs();
  // compute new heads
  const newHeads=[];
  for(const s of snakes){
    s.prev=s.body.map(seg=>({x:seg.x,y:seg.y}));
    newHeads.push({x:s.body[0].x+s.dir.x, y:s.body[0].y+s.dir.y});
  }
  // wall death
  for(let i=0;i<snakes.length;i++){
    const nh=newHeads[i];
    if(!inBounds(nh.x,nh.y)){ die('wall'); return; }
  }
  // head-on: both heads into the same cell
  if(snakes.length===2 && newHeads[0].x===newHeads[1].x && newHeads[0].y===newHeads[1].y){ die('head-on'); return; }
  // body death (tail vacates unless growing)
  for(let i=0;i<snakes.length;i++){
    const nh=newHeads[i];
    for(let j=0;j<snakes.length;j++){
      const other=snakes[j];
      const lim=other.body.length-(growPending>0?0:1);
      for(let k=0;k<lim;k++){
        if(other.body[k].x===nh.x && other.body[k].y===nh.y){ die('body'); return; }
      }
    }
  }
  // hazard death
  for(let i=0;i<snakes.length;i++){
    const nh=newHeads[i];
    for(const h of hazards){ if(h.x===nh.x && h.y===nh.y){ die('hazard'); return; } }
  }
  // move
  for(let i=0;i<snakes.length;i++){
    snakes[i].body.unshift(newHeads[i]);
    if(growPending>0){ /* keep tail: grow */ }
    else snakes[i].body.pop();
  }
  if(growPending>0) growPending--;
  // eating
  let ate=false;
  for(let i=0;i<snakes.length;i++){
    const h=snakes[i].body[0];
    const fi=foods.findIndex(f=>f.x===h.x&&f.y===h.y);
    if(fi>=0){
      foods.splice(fi,1); ate=true;
      burst(cellCX(h.x),cellCY(h.y),'255,220,120',10,GW*0.35);
    }
  }
  if(ate){
    score+=1; growPending+=1;
    combo = comboT>0 ? combo+1 : 0; comboT=3.5;
    playEat(combo);
    if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
    const h=snakes[0].body[0];
    floaters.push({text:'+1', x:cellCX(h.x), y:cellCY(h.y)-CELL, life:0.8, c:'#ffd166'});
    if(!splitDone){ doSplit(); return; }
    spawnFoodPair();
    if(Math.random()<0.4) spawnHazardPair();
  }
}

function update(dt){
  elapsed+=dt;
  if(splitPause>0){ splitPause-=dt; }
  // AI pause gate: the pause icon freezes stepping. The game logic below
  // is otherwise identical to the shipped game.
  else if(mode==='play' && !window.__nsPaused){
    tickAcc+=dt*1000;
    while(tickAcc>=tickMs){ tickAcc-=tickMs; step(); if(mode!=='play') break; }
  }
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
  if(hazards.length){
    for(const h of hazards) h.life-=dt;
    hazards=hazards.filter(h=>h.life>0);
  }
  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
  for(const f of floaters){ f.y-=H*0.05*dt; f.life-=dt; }
  floaters=floaters.filter(f=>f.life>0);
  for(const s of stars){ s.tw+=dt*2; }
  if(shakeT>0) shakeT-=dt; if(flashT>0) flashT-=dt;
}

// ---------- input ----------
let anchor=null;
function press(x,y){
  audio(); if(AC && AC.state==='suspended' && !muted) AC.resume();
  if(mode!=='play'){ startGame(); return; }
  anchor={x:x,y:y};
}
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); press(e.clientX,e.clientY); });
cv.addEventListener('pointermove', e=>{
  if(!anchor || mode!=='play') return;
  const dx=e.clientX-anchor.x, dy=e.clientY-anchor.y;
  if(Math.hypot(dx,dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) queueDir(dx>0?'right':'left');
  else queueDir(dy>0?'down':'up');
  anchor={x:e.clientX,y:e.clientY};
});
addEventListener('pointerup', ()=>{ anchor=null; });
addEventListener('pointercancel', ()=>{ anchor=null; });
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){ e.preventDefault();
    if(mode!=='play'){ audio(); startGame(); } return; }
  const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};
  if(map[k]){ e.preventDefault(); if(mode==='play') queueDir(map[k]); }
});

// ---------- render ----------
function draw(){
  ctx.save();
  if(shakeT>0){ const s=shakeT*22; ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s); }
  ctx.fillStyle='#0a0618'; ctx.fillRect(-30,-30,W+60,H+60);
  for(const s of stars){
    const a=0.2+0.5*(0.5+0.5*Math.sin(s.tw));
    ctx.globalAlpha=a; ctx.fillStyle='#cdd6ff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill(); }
  ctx.globalAlpha=1;
  // field frame + grid
  ctx.strokeStyle='rgba(130,150,255,0.10)'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=1;i<COLS;i++){ ctx.moveTo(GX+i*CELL,FY); ctx.lineTo(GX+i*CELL,FY+FH); }
  for(let j=1;j<ROWS;j++){ ctx.moveTo(GX,FY+j*CELL); ctx.lineTo(GX+GW,FY+j*CELL); }
  ctx.stroke();
  ctx.strokeStyle='rgba(150,170,255,0.35)'; ctx.lineWidth=2;
  ctx.strokeRect(GX-1,FY-1,GW+2,FH+2);
  // corner ticks
  ctx.strokeStyle='rgba(150,170,255,0.6)'; ctx.lineWidth=2;
  const L=14;
  ctx.beginPath();
  ctx.moveTo(GX-L,FY); ctx.lineTo(GX+L,FY); ctx.moveTo(GX,FY-L); ctx.lineTo(GX,FY+L);
  ctx.moveTo(GX+GW-L,FY); ctx.lineTo(GX+GW+L,FY); ctx.moveTo(GX+GW,FY-L); ctx.lineTo(GX+GW,FY+L);
  ctx.moveTo(GX-L,FY+FH); ctx.lineTo(GX+L,FY+FH); ctx.moveTo(GX,FY+FH-L); ctx.lineTo(GX,FY+FH+L);
  ctx.moveTo(GX+GW-L,FY+FH); ctx.lineTo(GX+GW+L,FY+FH); ctx.moveTo(GX+GW,FY+FH-L); ctx.lineTo(GX+GW,FY+FH+L);
  ctx.stroke();

  if(mode==='menu'){ drawMenu(); }
  else {
    drawFoods(); drawHazards();
    for(const s of snakes) drawSnake(s);
    drawHUD();
    if(mode==='over') drawOver();
  }
  for(const p of particles){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2.2));
    ctx.fillStyle=`rgba(${p.c},1)`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.29); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life*1.6);
    ctx.font='700 18px system-ui,sans-serif'; ctx.fillStyle=f.c;
    ctx.fillText(f.text,f.x,f.y); }
  ctx.globalAlpha=1;
  if(flashT>0){ ctx.fillStyle=`rgba(255,255,255,${flashT*1.4})`; ctx.fillRect(-30,-30,W+60,H+60); }
  ctx.restore();
}
function tickProgress(){
  if(splitPause>0) return 1;
  return Math.min(1, tickAcc/tickMs);
}
function interpPos(s,i){
  const cur=s.body[i], prev=s.prev[Math.min(i,s.prev.length-1)]||cur;
  const t=tickProgress();
  return { x:lerp(prev.x,cur.x,t), y:lerp(prev.y,cur.y,t) };
}
function drawSnake(s){
  const n=s.body.length;
  const pts=[];
  for(let i=0;i<n;i++){ const p=interpPos(s,i); pts.push({x:cellCX(p.x), y:cellCY(p.y)}); }
  if(pts.length<2) return;
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  // glow pass
  ctx.shadowColor=s.glow; ctx.shadowBlur=16;
  ctx.strokeStyle=s.color; ctx.globalAlpha=0.55;
  ctx.lineWidth=CELL*0.66;
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
  // core pass: taper toward tail by stroking in segments
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  for(let i=0;i<pts.length-1;i++){
    const w=CELL*(0.62-0.3*(i/Math.max(1,n-1)));
    ctx.strokeStyle=s.color;
    ctx.globalAlpha=1-0.55*(i/Math.max(1,n-1));
    ctx.lineWidth=w;
    ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[i+1].x,pts[i+1].y); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // head
  const h=pts[0];
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(h.x,h.y,CELL*0.34,0,6.29); ctx.fill();
  ctx.fillStyle=s.color;
  ctx.beginPath(); ctx.arc(h.x,h.y,CELL*0.27,0,6.29); ctx.fill();
  // eyes look along direction
  const d=s.dir, ex=d.x*3.5, ey=d.y*3.5;
  const px=-d.y, py=d.x; // perpendicular
  ctx.fillStyle='#0a0618';
  ctx.beginPath(); ctx.arc(h.x+px*4+ex,h.y+py*4+ey,2.2,0,6.29);
  ctx.arc(h.x-px*4+ex,h.y-py*4+ey,2.2,0,6.29); ctx.fill();
  ctx.restore();
}
function drawFoods(){
  const t=performance.now()/1000;
  for(const f of foods){
    const x=cellCX(f.x), y=cellCY(f.y);
    const pulse=1+0.18*Math.sin(t*4+f.ph);
    ctx.save();
    ctx.shadowColor='#ffd166'; ctx.shadowBlur=18;
    ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.arc(x,y,CELL*0.26*pulse,0,6.29); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#fff3c4';
    ctx.beginPath(); ctx.arc(x,y,CELL*0.13*pulse,0,6.29); ctx.fill();
    ctx.strokeStyle='rgba(255,209,102,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,CELL*0.44*pulse,0,6.29); ctx.stroke();
    ctx.restore();
  }
}
function drawHazards(){
  const t=performance.now()/1000;
  for(const h of hazards){
    const x=cellCX(h.x), y=cellCY(h.y);

<script>
"use strict";
/* Neon Serpent AI — plays the shipped game through its own input.
   Every decision goes through window.__ns.setDir(), the exact function a
   swipe calls. The AI never touches positions, scores, or internals.
   v7 brain:
   - The snakes are one linked walk: magenta is always M(c)=(12-x,y+6) of
     cyan, so cyan's body must never meet M(body). That caps cyan's body at
     91 cells (score 88) no matter what; the largest conflict-free cycle that
     keeps every food pair reachable is 84 cells (solver-proven optimal), so
     the AI patrols an 84-cell Hamiltonian cycle (best layout picked by
     headless trials over many solver-generated 84-cycles).
   - When a hazard sits on the cycle, a depth-first search with cycle-first
     move ordering finds a survive-and-rejoin detour (it can leave the cycle
     anywhere on the board); a layered BFS is the fallback. Every plan is
     re-simulated with moving bodies each tick and dropped if it goes illegal.
   - Food the cycle can never reach gets a verified round-trip excursion.
   - If the head is off the cycle with no hazard and no route home, the old
     greedy planner (flood-fill + tail-reachability) takes over. */
const AI = {
  paused: false, runs: 0, sessionBest: 0,
  allBest: parseInt(localStorage.getItem('nsai_best')||'0',10),
  strategy: 'STARTING', grow: 0, lastScore: 0,
  lastHeads: '', lastMode: 'menu', lastSplit: false,
  ticksSinceEat: 0, committedPath: null, plan: null, restartTimer: null, stepMs: 0, lastStepT: 0,
};
const AI_DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
const AI_NAMES = ['up','down','left','right'];
const AI_NEIGH = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
function aiMirror(d){ return {x:-d.x, y:d.y}; }
function aiKey(x,y){ return x+','+y; }

function aiState(){
  const ns = window.__ns; if(!ns) return null;
  return { ns: ns, mode: ns.mode, score: ns.score,
    snakes: ns.snakes.map(s=>({ dir:{x:s.dir.x,y:s.dir.y}, body:s.body.map(c=>({x:c.x,y:c.y})) })),
    foods: ns.foods.map(f=>({x:f.x,y:f.y})),
    hazards: ns.hazards.map(h=>({x:h.x,y:h.y,life:h.life})),
    COLS: ns.COLS, ROWS: ns.ROWS, split: ns.splitDone };
}
function aiBFS(sx, sy, blocked, targets, COLS, ROWS){
  const tset = new Set(targets.map(t=>aiKey(t.x,t.y)));
  if(tset.has(aiKey(sx,sy))) return 0;
  const seen = new Set([aiKey(sx,sy)]);
  let frontier = [[sx,sy]], d = 0;
  while(frontier.length){
    d++; const next = [];
    for(const cell of frontier){
      for(const dd of AI_NEIGH){
        const nx=cell[0]+dd.x, ny=cell[1]+dd.y;
        if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
        const k=aiKey(nx,ny);
        if(seen.has(k)||blocked.has(k)) continue;
        if(tset.has(k)) return d;
        seen.add(k); next.push([nx,ny]);

  }

}

    const next=[];
    for(const cell of frontier){

      for(const dd of AI_NEIGH){
        const nx=cell[0]+dd.x, ny=cell[1]+dd.y;
        if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
        const k=aiKey(nx,ny);
        if(seen.has(k)||blocked.has(k)) continue;
        seen.add(k); next.push([nx,ny]);
      }
    }

  }

}
// ---------- Hamiltonian cycle (post-split backbone) ----------
// Cyan patrols a Hamiltonian cycle over cols 0-5, rows 0-12 (78 cells).
// Magenta's path is the offset mirror (12-x, y+6), so one command
// advances both snakes along their paths. Every food row is reachable
// from the cycle, and following it can never trap either snake: the body
// always trails behind on the cycle and the next cell is always free.
// Verified offline: 78 unique cells, closed, all food rows edible, both
// split start cells on the paths at the same phase.
const AI_CYCLE = (function(){
  // 84-cell conflict-free cycle (CP-SAT optimum with every food pair coverable)
  const cells = [[0,6],[1,6],[2,6],[3,6],[4,6],[4,5],[3,5],[2,5],[2,4],[2,3],[2,2],[1,2],[1,3],[1,4],[1,5],[0,5],[0,4],[0,3],[0,2],[0,1],[0,0],[1,0],[1,1],[2,1],[2,0],[3,0],[3,1],[3,2],[4,2],[5,2],[5,1],[4,1],[4,0],[5,0],[6,0],[6,1],[6,2],[6,3],[5,3],[4,3],[3,3],[3,4],[4,4],[5,4],[6,4],[6,5],[5,5],[5,6],[5,7],[5,8],[4,8],[4,7],[3,7],[3,8],[3,9],[3,10],[4,10],[4,9],[5,9],[5,10],[5,11],[5,12],[4,12],[4,11],[3,11],[3,12],[2,12],[1,12],[0,12],[0,11],[0,10],[1,10],[1,11],[2,11],[2,10],[2,9],[1,9],[0,9],[0,8],[1,8],[2,8],[2,7],[1,7],[0,7]];

  }

})();
function aiCycleDirName(st){
  if(st.snakes.length!==2) return null;
  const h = st.snakes[0].body[0];
  const d = AI_CYCLE.get(h.x+','+h.y);
  if(!d) return null;

  if(d.x===-1) return 'left';
  if(d.y===-1) return 'up';

// Cycle order (insertion order of the map) gives each cell an index, so
// the distance along the cycle from the head to any on-cycle food is cheap.
const AI_CYCLE_KEYS = [...AI_CYCLE.keys()];
const AI_CYCLE_IDX = new Map(AI_CYCLE_KEYS.map((k,i)=>[k,i]));
const AI_CYCLE_LEN = AI_CYCLE_KEYS.length;
function aiCycleDist(fromKey, toKey){
  const a=AI_CYCLE_IDX.get(fromKey), b=AI_CYCLE_IDX.get(toKey);
  if(a===undefined||b===undefined) return Infinity;
  return (b-a+AI_CYCLE_LEN)%AI_CYCLE_LEN;
}
// ---------- pathfinder (shortcuts + detours) ----------
// BFS over the JOINT state: the state is cyan's cell; magenta's cell is
// the offset mirror (12-x, y+6), so a move is valid only when BOTH
// snakes' next cells are free. A cyan-only BFS can return a path that
// walks magenta into a wall or body, which is how the AI used to loop
// forever flip-flopping between a shortcut and the patrol.
// Returns {dirs:[direction names for cyan...], len, end:{x,y}} or null.
// The first step never reverses `curDir` (the game rejects reverses).
function aiPath(sx, sy, blocked, targets, COLS, ROWS, curDir){
  const tset = new Set(targets.map(t=>aiKey(t.x,t.y)));
  if(tset.has(aiKey(sx,sy))) return {dirs:[], len:0, end:{x:sx,y:sy}};
  const DIRS4=[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]];
  const prev = new Map();
  const seen = new Set([aiKey(sx,sy)]);
  let frontier=[[sx,sy]];
  while(frontier.length){
    const next=[];
    for(const cell of frontier){
      const cx=cell[0], cy=cell[1];
      const mx=12-cx, my=cy+6; // magenta head for this cyan cell
      for(const step of DIRS4){
        const nm=step[0], dx=step[1], dy=step[2];
        if(cx===sx && cy===sy && curDir && dx===-curDir.x && dy===-curDir.y) continue;
        const nx=cx+dx, ny=cy+dy;
        const nmx=mx-dx, nmy=my+dy; // magenta moves by mirror(d)
        if(nx<0||nx>=COLS||ny<0||ny>=ROWS) continue;
        if(nmx<0||nmx>=COLS||nmy<0||nmy>=ROWS) continue;
        const k=aiKey(nx,ny), km=aiKey(nmx,nmy);
        if(seen.has(k)||blocked.has(k)||blocked.has(km)) continue;
        seen.add(k);
        prev.set(k,{from:aiKey(cx,cy), dir:nm});
        if(tset.has(k)){
          const dirs=[]; let kk=k;
          while(kk!==aiKey(sx,sy)){ const p=prev.get(kk); dirs.unshift(p.dir); kk=p.from; }
          return {dirs:dirs, len:dirs.length, end:{x:nx,y:ny}};
        }
        next.push([nx,ny]);
      }
    }
    frontier=next;
  }
  return null;
}
// Simulate a whole path step by step with MOVING bodies (tails vacate,
// growth on eating), exactly as the game steps. Returns true only if
// every step is non-fatal for both snakes and the end position is
// survivable (each head can still reach its own tail). A static BFS can
// bless a path whose later steps run into a body that has since moved;
// this is the gate that stops the AI committing to those.
function aiSimulatePath(dirs, st){
  const COLS=st.COLS, ROWS=st.ROWS;
  let bodies = st.snakes.map(s=>s.body.map(c=>({x:c.x,y:c.y})));
  let grow = AI.grow;
  const haz = new Set(st.hazards.map(h=>aiKey(h.x,h.y)));
  const foodSet = new Set(st.foods.map(f=>aiKey(f.x,f.y)));
  for(const name of dirs){
    const d=AI_DIRS[name];
    const md = bodies.length===2 ? aiMirror(d) : null;
    const nh = bodies.map((b,i)=>({x:b[0].x+(i===0?d.x:md.x), y:b[0].y+(i===0?d.y:md.y)}));
    for(const h of nh) if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS) return false;
    if(bodies.length===2 && nh[0].x===nh[1].x && nh[0].y===nh[1].y) return false;
    for(const h of nh){
      if(haz.has(aiKey(h.x,h.y))) return false;
      for(let j=0;j<bodies.length;j++){
        const lim = grow===0 ? bodies[j].length-1 : bodies[j].length;
        for(let k=0;k<lim;k++) if(bodies[j][k].x===h.x && bodies[j][k].y===h.y) return false;
      }
    }
    const ate = nh.some(h=>foodSet.has(aiKey(h.x,h.y)));
    bodies = bodies.map((b,i)=>{
      const nb=[nh[i]].concat(b);
      if(grow===0) nb.pop();
      return nb;
    });
    grow = Math.max(0, grow-1) + (ate?1:0);
  }
  const blocked = new Set();
  bodies.forEach(b=>b.forEach(c=>blocked.add(aiKey(c.x,c.y))));
  haz.forEach(k=>blocked.add(k));
  // End safety: each head must have at least its own body length of
  // reachable free space, so the position is not a dead end. (Requiring
  // tail-reachability here was too strict: after a growth step the tail
  // is a body-length away, and long snakes failed it even on open
  // ground — which starved the AI of food paths entirely.)
  for(let i=0;i<bodies.length;i++){
    const sp = aiFlood(bodies[i][0].x, bodies[i][0].y, blocked, COLS, ROWS);
    if(sp < bodies[i].length) return false;
  }
  return true;
}

// ---------- v7 planner: whole-board time-expanded search around the cycle ----------
// The linked system is one cyan walk: magenta's cell is always M(c)=(12-x,y+6),
// so only cyan's body is tracked. Cyan head c is legal iff c, M(c) and M^-1(c)
// avoid cyan's body (tail vacating unless growing) and no hazard covers c or M(c).
// Normal play is a cycle patrol. When patrolling would die within a hazard's
// remaining life, a layered BFS over (cell, time) finds the shortest detour
// anywhere on the board that survives and then lands back on the cycle with a
// verified clean run ahead. The same search plans safe round trips to food
// the cycle can never reach.
const AI_ID = (x,y)=>y*13+x;
const AI_MID = new Int16Array(247).fill(-1), AI_MINV = new Int16Array(247).fill(-1);
for(let y=0;y<19;y++) for(let x=0;x<13;x++){
  if(y<=12) AI_MID[AI_ID(x,y)] = AI_ID(12-x,y+6);
  if(y>=6) AI_MINV[AI_ID(x,y)] = AI_ID(12-x,y-6);
}
const AI_IDX = new Int16Array(247).fill(-1), AI_SUCC = new Int16Array(247).fill(-1);
AI_CYCLE_KEYS.forEach((k,i)=>{ const p=k.split(','); AI_IDX[AI_ID(+p[0],+p[1])]=i; });
AI_CYCLE_KEYS.forEach((k,i)=>{ const p=k.split(','), q=AI_CYCLE_KEYS[(i+1)%AI_CYCLE_LEN].split(',');
  AI_SUCC[AI_ID(+p[0],+p[1])]=AI_ID(+q[0],+q[1]); });
const AI_NB = [];
for(let id=0;id<247;id++){ const x=id%13, y=(id/13)|0, out=[];
  if(y<=12) for(const d of AI_NEIGH){ const nx=x+d.x, ny=y+d.y; if(nx>=0&&nx<13&&ny>=0&&ny<=12) out.push(AI_ID(nx,ny)); }
  AI_NB.push(out); }
function aiDirOf(from,to){
  const dx=(to%13)-(from%13), dy=((to/13)|0)-((from/13)|0);
  return dx===1?'right':dx===-1?'left':dy===-1?'up':'down';
}
// does following the cycle from this body stay legal for K steps?
function aiCycleOK(body, grow, t0, K, X){
  const L=body.length; if(AI_IDX[body[0]]<0) return false;
  const occ=new Uint8Array(247), ring=new Int16Array(256);
  for(let k=0;k<L;k++){ ring[(255-k)&255]=body[k]; occ[body[k]]=1; }
  let hd=255, len=L, g=grow, h=body[0];
  const taken=[0,0,0,0];
  for(let s=0;s<K;s++){
    const p=AI_SUCC[h];
    if(t0+s < X.blockUntil[p]) return false;
    const mp=AI_MID[p], mi=AI_MINV[p];
    if(mp<0) return false;
    if(g===0){ occ[ring[(hd-len+1)&255]]=0; }
    if(occ[p]||occ[mp]||(mi>=0&&occ[mi])) return false;
    hd=(hd+1)&255; ring[hd]=p; occ[p]=1;
    if(g>0){ g--; len++; }
    const fi=X.foodAt[p]; if(fi>=0 && !taken[fi]){ taken[fi]=1; g++; }
    h=p;
  }
  return true;
}
function aiExpand(S, p, t, X){
  if(t < X.blockUntil[p]) return null;
  const mp=AI_MID[p], mi=AI_MINV[p]; if(mp<0) return null;
  const body=S.body, L=body.length, lim=S.grow>0?L:L-1;
  for(let k=0;k<lim;k++){ const c=body[k]; if(c===p||c===mp||c===mi) return null; }
  const nb=new Array(S.grow>0?L+1:L); nb[0]=p;
  for(let k=1;k<nb.length;k++) nb[k]=body[k-1];
  let g=S.grow>0?S.grow-1:0, ate=S.ate;
  const fi=X.foodAt[p]; if(fi>=0){ g++; ate=true; }
  return {body:nb, grow:g, ate:ate, parent:S, move:aiDirOf(body[0],p)};
}
function aiMakeCtx(st){
  const blockUntil=new Int16Array(247), foodAt=new Int8Array(247).fill(-1);
  const stepMs = Math.max(20, AI.stepMs||100);
  let maxRem=0;
  for(const h of st.hazards){
    const rem=Math.ceil(h.life*1000/stepMs)+1; if(rem>maxRem) maxRem=rem;
    const hc=AI_ID(h.x,h.y);
    if(h.y<=12 && blockUntil[hc]<rem) blockUntil[hc]=rem;
    const mi=AI_MINV[hc]; if(mi>=0 && blockUntil[mi]<rem) blockUntil[mi]=rem;
  }
  st.foods.forEach((f,i)=>{ const fc=AI_ID(f.x,f.y); if(f.y<=12) foodAt[fc]=i; const mi=AI_MINV[fc]; if(mi>=0) foodAt[mi]=i; });
  return {blockUntil, foodAt, maxRem};
}
// layered BFS over (head cell, time). Returns {moves, goal} or null.
function aiSearch(st, X, needEat, Hmax, budget){
  const root={body:st.snakes[0].body.map(c=>AI_ID(c.x,c.y)), grow:AI.grow, ate:false, parent:null, move:null};
  const cur0=st.snakes[0].dir;
  const rootRev = AI_ID(root.body[0]%13 - cur0.x, ((root.body[0]/13)|0) - cur0.y);
  const seen=new Set(); let layer=[root], deepest=root;
  for(let t=0;t<Hmax;t++){
    const next=[];
    for(const S of layer){
      const hdc=S.body[0];
      for(const p of AI_NB[hdc]){
        if(t===0 && p===rootRev) continue;
        const key=((p*2+(S.ate?1:0))*256)+t;
        if(seen.has(key)) continue;
        if(--budget<0) return needEat ? null : aiPlanFrom(deepest);
        const ns=aiExpand(S,p,t,X); if(!ns) continue;
        seen.add(key);
        if((!needEat||ns.ate) && AI_IDX[p]>=0 &&
           aiCycleOK(ns.body, ns.grow, t+1, Math.max(0,X.maxRem-(t+1))+30, X)) return aiPlanFrom(ns,true);
        next.push(ns);
      }
    }
    if(!next.length) break;
    layer=next; deepest=next[0];
  }
  return needEat ? null : aiPlanFrom(deepest);
}
function aiPlanFrom(S, goal){
  const moves=[]; for(let n=S;n&&n.parent;n=n.parent) moves.unshift(n.move);
  return {moves, goal:!!goal};
}
function aiPlanValid(moves, st, X){
  let S={body:st.snakes[0].body.map(c=>AI_ID(c.x,c.y)), grow:AI.grow, ate:false};
  for(let t=0;t<moves.length;t++){
    const hd=S.body[0], d=AI_DIRS[moves[t]];
    const nx=(hd%13)+d.x, ny=((hd/13)|0)+d.y;
    if(nx<0||nx>12||ny<0||ny>12) return false;
    S=aiExpand(S,AI_ID(nx,ny),t,X); if(!S) return false;
  }
  return true;
}

// Depth-first survive-and-rejoin search with cycle-first move ordering. Walks the
// cycle (and forward chords) when it can, deviates only when it must, and
// succeeds once every hazard has expired and the head sits on the cycle with a
// clean run ahead. Node-capped; returns {moves, goal} (deepest path when capped).
function aiDfsPlan(st, X, nodeCap){
  const body0=st.snakes[0].body.map(c=>AI_ID(c.x,c.y));
  const cur0=st.snakes[0].dir;
  const rev=AI_ID(body0[0]%13 - cur0.x, ((body0[0]/13)|0) - cur0.y);
  const ring=new Int16Array(1024), occ=new Uint8Array(247), path=new Int16Array(800);
  const L0=body0.length;
  for(let k=0;k<L0;k++){ ring[(1023-k)&1023]=body0[k]; occ[body0[k]]=1; }
  let hd=1023, len=L0, nodes=0, bestT=-1, bestPath=null, succT=-1;
  const taken=[0,0,0,0];
  const T_END = Math.min(X.maxRem, 600);          // hazards are gone at this time
  const T_MAX = T_END + 70;
  function cycleOKNow(g,t){
    const bodyArr=new Array(len); for(let k=0;k<len;k++) bodyArr[k]=ring[(hd-k)&1023];
    return aiCycleOK(bodyArr, g, t, 30, X);
  }
  function dfs(t,g){
    if(t>=T_END && AI_IDX[ring[hd&1023]]>=0 && cycleOKNow(g,t)){ succT=t; return true; }
    if(t>=T_MAX) return false;
    if(++nodes>nodeCap) return false;
    if(t>bestT){ bestT=t; bestPath=Array.prototype.slice.call(path,0,t); }
    const h=ring[hd&1023], nbs=AI_NB[h], succ=AI_SUCC[h];
    // order: cycle successor, other cycle cells by forward jump, then the rest
    const cand=[]; 
    for(let i=0;i<nbs.length;i++){ const p=nbs[i];
      if(t===0 && p===rev) continue;
      let pr = p===succ ? 0 : (AI_IDX[p]>=0 && AI_IDX[h]>=0 ? 1+((AI_IDX[p]-AI_IDX[h]+AI_CYCLE_LEN)%AI_CYCLE_LEN)/1000 : (AI_IDX[p]>=0?1.5:2));
      cand.push([pr,p]); }
    cand.sort((a,b)=>a[0]-b[0]);
    for(let ci=0;ci<cand.length;ci++){
      const p=cand[ci][1];
      if(t<X.blockUntil[p]) continue;
      const mp=AI_MID[p], mi=AI_MINV[p]; if(mp<0) continue;
      let tail=-1;
      if(g===0){ tail=ring[(hd-len+1)&1023]; occ[tail]=0; }
      if(occ[p]||occ[mp]||(mi>=0&&occ[mi])){ if(tail>=0) occ[tail]=1; continue; }
      hd=(hd+1)&1023; ring[hd]=p; occ[p]=1; path[t]=p;
      let g2=g>0?g-1:0, len2=len; if(g>0) len++; 
      const fi=X.foodAt[p]; let ate=false; if(fi>=0 && !taken[fi]){ taken[fi]=1; g2++; ate=true; }
      const ok=dfs(t+1,g2);
      if(ate) taken[X.foodAt[p]]=0;
      len=len2; occ[p]=0; hd=(hd-1)&1023;
      if(tail>=0) occ[tail]=1;
      if(ok) return true;
      if(nodes>nodeCap) return false;
    }
    return false;
  }
  const ok=dfs(0,AI.grow);
  const cells = ok ? Array.prototype.slice.call(path,0,succT) : bestPath;
  const moves=[]; let prev=body0[0];
  for(const p of (cells||[])){ moves.push(aiDirOf(prev,p)); prev=p; }
  return {ok, nodes, moves, goal:ok};
}

function aiNextMove(st){
  if(st.snakes.length!==2) return null;
  const X=aiMakeCtx(st);
  const body=st.snakes[0].body.map(c=>AI_ID(c.x,c.y));
  // 1. follow a cached plan while it still simulates legal
  if(AI.plan && AI.plan.moves.length){
    if(aiPlanValid(AI.plan.moves, st, X)){ const m=AI.plan.moves.shift(); AI.strategy=AI.plan.label; return m; }
    AI.plan=null;
  }
  // 2. plain patrol when the cycle ahead is clean (K covers every hazard's life)
  const onCyc = AI_IDX[body[0]]>=0;
  const patrolOK = onCyc && aiCycleOK(body, AI.grow, 0, X.maxRem+30, X);
  // 3. food the cycle can never reach: plan a verified round trip
  let wantTrip=false;
  if(patrolOK && st.foods.length){
    wantTrip = !st.foods.some(f=>{ const fc=AI_ID(f.x,f.y); const mi=AI_MINV[fc];
      return (f.y<=12 && AI_IDX[fc]>=0) || (mi>=0 && AI_IDX[mi]>=0); });
  }
  if(patrolOK && !wantTrip){ AI.strategy='PATROL'; return aiDirOf(body[0], AI_SUCC[body[0]]); }
  let plan=null;
  if(wantTrip){
    plan=aiSearch(st, X, true, 70, 40000);
    if(plan && plan.goal && plan.moves.length){ plan.label='EXCURSION'; }
    else plan=null;
    if(!plan){ AI.strategy='PATROL'; return aiDirOf(body[0], AI_SUCC[body[0]]); }
  } else {
    plan=aiDfsPlan(st, X, 150000);
    if(!plan.goal){ const alt=aiSearch(st, X, false, Math.max(40, X.maxRem+12), 60000); if(alt && alt.goal) plan=alt; else if(!(plan.moves&&plan.moves.length)) plan=alt; }
    if(plan && !plan.goal && X.maxRem===0) plan=null; // no hazard and no way home: let the greedy planner hunt
    if(plan && plan.moves.length) plan.label = plan.goal ? 'DETOUR' : 'SURVIVING';
    else plan=null;
  }
  if(!plan) return null;
  AI.plan=plan; const m=plan.moves.shift(); AI.strategy=plan.label; return m;
}

function aiDecide(){
  const st = aiState(); if(!st || st.mode!=='play' || AI.paused) return;
  const COLS=st.COLS, ROWS=st.ROWS, snakes=st.snakes, foods=st.foods, hazards=st.hazards;
  const split = snakes.length===2;
  const cur = snakes[0].dir;
  const cyc = aiCycleDirName(st); // the cycle move, when the head is on it
  const curBlocked = new Set();
  snakes.forEach(s=>{
    const lim = AI.grow===0 ? s.body.length-1 : s.body.length;
    for(let i=0;i<lim;i++) curBlocked.add(aiKey(s.body[i].x, s.body[i].y));
  });
  hazards.forEach(h=>curBlocked.add(aiKey(h.x,h.y)));
  if(split){
    const nm = aiNextMove(st);
    if(nm){
      window.__ns.setDir(nm);
      window.__AI_DEBUG = window.__AI_DEBUG || { decisions: [], deaths: [] };
      window.__AI_DEBUG.decisions.push({ score: st.score, grow: AI.grow, dir: nm, heads: st.snakes.map(s=>({x:s.body[0].x,y:s.body[0].y})),
        dirs: st.snakes.map(s=>({x:s.dir.x,y:s.dir.y})), foods: st.foods, hazards: st.hazards.length, label: AI.strategy });
      if(window.__AI_DEBUG.decisions.length>40) window.__AI_DEBUG.decisions.shift();
      AI.committedPath = null;
      return;
    }
  }
  const cycleCells = AI_CYCLE_KEYS.map(k=>{ const p=k.split(','); return {x:+p[0], y:+p[1]}; });
  let commitDir=null;
  // Committed paths: follow the plan through instead of replanning
  // every tick (replanning flip-flops and loops). A path is only
  // committed when the whole thing simulates safe with moving bodies.
  if(AI.committedPath && AI.committedPath.length){
    commitDir = AI.committedPath[0];
  } else if(split){
    const hd = snakes[0].body[0];
    const onCycle = AI_CYCLE.has(aiKey(hd.x,hd.y));
    if(onCycle && foods.length && st.score >= 50){
      // Excursion: round trip cycle -> off-cycle food -> cycle. Only
      // late (the cycle feeds the snakes fine until ~50) and only when
      // the trip is SHORT (<=14 steps): a long trip is exposed to a
      // new hazard spawning on the way back, which is how the open
      // excursion policy died at 52. Food on the cycle needs no trip.
      const leg1 = aiPath(hd.x, hd.y, curBlocked, foods, COLS, ROWS, cur);
      if(leg1 && leg1.dirs.length && !AI_CYCLE.has(aiKey(leg1.end.x,leg1.end.y))){
        const lastDir = AI_DIRS[leg1.dirs[leg1.dirs.length-1]];
        const leg2 = aiPath(leg1.end.x, leg1.end.y, curBlocked, cycleCells, COLS, ROWS, lastDir);
        if(leg2 && leg2.dirs.length){
          const trip = leg1.dirs.concat(leg2.dirs);
          if(trip.length <= 14 && aiSimulatePath(trip, st)){ AI.committedPath = trip; commitDir = trip[0]; }
        }
      }
    }
    if(!commitDir && !onCycle){
      // No excursion and off the cycle: path back to the cycle.
      const rp = aiPath(hd.x, hd.y, curBlocked, cycleCells, COLS, ROWS, cur);
      if(rp && rp.dirs.length && aiSimulatePath(rp.dirs, st)){ AI.committedPath = rp.dirs.slice(); commitDir = rp.dirs[0]; }
    }
  }
  // solid cells for the death check: old bodies, tail excluded iff it vacates
  const solid = new Set();
  snakes.forEach(s=>{
    const lim = AI.grow===0 ? s.body.length-1 : s.body.length;
    for(let i=0;i<lim;i++) solid.add(aiKey(s.body[i].x, s.body[i].y));
  });
  const haz = new Set(hazards.map(h=>aiKey(h.x,h.y)));
  let best=null, bestVal=-Infinity, bestLabel='SURVIVING';
  for(const name of AI_NAMES){
    const d=AI_DIRS[name];
    if(d.x===-cur.x && d.y===-cur.y) continue; // reverse: the game rejects it
    const dirs = [d, split?aiMirror(d):null];
    const nh = snakes.map((s,i)=>({x:s.body[0].x+dirs[i].x, y:s.body[0].y+dirs[i].y}));
    let dead=false;
    for(const h of nh) if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS) dead=true;
    if(split && nh[0].x===nh[1].x && nh[0].y===nh[1].y) dead=true;
    if(!dead) for(const h of nh){
      if(solid.has(aiKey(h.x,h.y)) || haz.has(aiKey(h.x,h.y))) dead=true;
    }
    if(dead) continue;
    // resulting bodies and blocked set
    const newBodies = snakes.map((s,i)=>{
      const b=[nh[i]].concat(s.body);
      if(AI.grow===0) b.pop();
      return b;
    });
    const blocked = new Set();
    newBodies.forEach(b=>b.forEach(c=>blocked.add(aiKey(c.x,c.y))));
    hazards.forEach(h=>blocked.add(aiKey(h.x,h.y)));
    const d0 = aiBFS(nh[0].x, nh[0].y, blocked, foods, COLS, ROWS);
    const d1 = split ? aiBFS(nh[1].x, nh[1].y, blocked, foods, COLS, ROWS) : Infinity;
    const sp0 = aiFlood(nh[0].x, nh[0].y, blocked, COLS, ROWS);
    const sp1 = split ? aiFlood(nh[1].x, nh[1].y, blocked, COLS, ROWS) : Infinity;
    const totalLen = newBodies.reduce((a,b)=>a+b.length,0);
    const minSpace = Math.min(sp0, sp1);
    const dMin = Math.min(d0, d1);
    const eats = foods.some(f=>(f.x===nh[0].x&&f.y===nh[0].y) || (split && f.x===nh[1].x&&f.y===nh[1].y));
    const hasPath = isFinite(dMin);
    // Tail-chase safety: can each head still reach its own tail through
    // free cells? A snake that can reach its tail can survive forever by
    // following it, so a move that breaks this for either snake is a
    // trap even when the flood fill still counts plenty of space. The
    // tail cell itself is the target; every other body cell is blocked.
    function tailReachable(snakeIdx){
      const body = newBodies[snakeIdx];
      const tail = body[body.length-1];
      const blk = new Set(blocked);
      blk.delete(aiKey(tail.x, tail.y));
      return isFinite(aiBFS(nh[snakeIdx].x, nh[snakeIdx].y, blk, [tail], COLS, ROWS));
    }
    const safe = tailReachable(0) && (!split || tailReachable(1));
    let value, label;
    // The cycle move wins whenever it is legal: it is the survival
    // backbone. Greedy only takes over when the cycle move is fatal
    // (a hazard sitting on the cycle) or the head is off the cycle.
    const cycleBonus = (name===cyc) ? 20000 : 0;
    // A committed path (excursion or rejoin) wins over patrolling:
    // follow the plan through. The candidate loop's death check is
    // still the hard gate — a fatal committed step is skipped and the
    // plan is dropped.
    const commitBonus = (name===commitDir) ? 40000 : 0;
    // Prefer landing back on the cycle after a detour, so the patrol resumes.
    const rejoinBonus = (split && AI_CYCLE.has(aiKey(nh[0].x, nh[0].y))) ? 5000 : 0;
    if(hasPath){
      value = commitBonus + cycleBonus + rejoinBonus + (safe?10000:0) + 5000 - dMin*10 + minSpace + (eats?500:0) + (name===(cur.x===1?'right':cur.x===-1?'left':cur.y===-1?'up':'down')?1:0);
      label = name===commitDir ? 'EXCURSION' : (name===cyc ? 'PATROL' : (eats?'HUNTING — EATING':'HUNTING'));
    } else {
      value = commitBonus + cycleBonus + rejoinBonus + (safe?10000:0) - 5000 + minSpace;
      label = name===commitDir ? 'EXCURSION' : (name===cyc ? 'PATROL' : (hazards.length?'WAITING OUT HAZARD':'SURVIVING'));
    }
    if(value>bestVal){ bestVal=value; best=name; bestLabel=label; }
  }
  if(best){ AI.strategy=bestLabel; window.__ns.setDir(best); }
  else AI.strategy='NO SAFE MOVE';
  // Consume the committed plan when its step is taken; drop it when the
  // plan's step was not taken (it was fatal, or something beat it).
  if(AI.committedPath && AI.committedPath.length){
    if(best===commitDir) AI.committedPath.shift();
    else AI.committedPath=null;
    if(AI.committedPath && !AI.committedPath.length) AI.committedPath=null;
  }
  // debug: keep the last decision so a death can be explained
  window.__AI_DEBUG = window.__AI_DEBUG || { decisions: [], deaths: [] };
  window.__AI_DEBUG.decisions.push({ score: st.score, grow: AI.grow, dir: best,
    heads: st.snakes.map(s=>({x:s.body[0].x,y:s.body[0].y})),
    dirs: st.snakes.map(s=>({x:s.dir.x,y:s.dir.y})),
    foods: st.foods, hazards: st.hazards.length, label: AI.strategy });
  if(window.__AI_DEBUG.decisions.length>40) window.__AI_DEBUG.decisions.shift();
}
function aiRunOver(){
  const st = aiState(); const sc = st?st.score:0;
  if(window.__AI_DEBUG && st){
    window.__AI_DEBUG.deaths.push({ score: sc, grow: AI.grow,
      heads: st.snakes.map(s=>({x:s.body[0].x,y:s.body[0].y})),
      dirs: st.snakes.map(s=>({x:s.dir.x,y:s.dir.y})),
      lens: st.snakes.map(s=>s.body.length),
      foods: st.foods, hazards: st.hazards,
      lastDecision: window.__AI_DEBUG.decisions[window.__AI_DEBUG.decisions.length-1]||null });
  }
  AI.runs++;
  if(sc>AI.sessionBest) AI.sessionBest=sc;
  if(sc>AI.allBest){ AI.allBest=sc; localStorage.setItem('nsai_best', String(sc)); }
  AI.strategy='RUN OVER — '+sc;
  clearTimeout(AI.restartTimer);
  AI.restartTimer=setTimeout(()=>{
    if(!AI.paused && window.__ns && window.__ns.mode==='over') window.__ns.start();
  }, 1200);
}
function aiPoll(){
  const st = aiState(); if(!st) return;
  if(st.mode==='play' && AI.lastMode!=='play'){
    AI.grow=0; AI.lastScore=0; AI.lastHeads=''; AI.lastSplit=false; AI.ticksSinceEat=0; AI.plan=null;
  }
  // Normal speed only: the game's own loop steps, the poll decides once
  // after each observed step.
  if(st.mode==='play' && !AI.paused){
    const heads = st.snakes.map(s=>aiKey(s.body[0].x,s.body[0].y)).join('|');
    if(heads!==AI.lastHeads){
      if(st.split && !AI.lastSplit) AI.grow=0;
      else { const ate = st.score > AI.lastScore; AI.grow = Math.max(0, AI.grow-1) + (ate?1:0); }
      { const nowT = performance.now(); if(AI.lastStepT){ const dt=Math.min(300,Math.max(15,nowT-AI.lastStepT)); AI.stepMs = AI.stepMs ? AI.stepMs*0.7+dt*0.3 : dt; } AI.lastStepT = nowT; }
      if(st.score > AI.lastScore) AI.ticksSinceEat=0; else AI.ticksSinceEat++;
      AI.lastScore = st.score; AI.lastHeads = heads; AI.lastSplit = st.split;
      aiDecide();
    }
  }
  if(st.mode==='over' && AI.lastMode==='play') aiRunOver();
  AI.lastMode = st.mode;
}
const AI_ICON_PAUSE='<svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></svg>';
const AI_ICON_PLAY='<svg viewBox="0 0 24 24" width="18" height="18"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>';
document.getElementById('ai-pause').addEventListener('click', ()=>{
  AI.paused=!AI.paused;
  window.__nsPaused = AI.paused;
  document.getElementById('ai-pause').innerHTML = AI.paused?AI_ICON_PLAY:AI_ICON_PAUSE;
  document.getElementById('ai-pause').setAttribute('aria-label', AI.paused?'play':'pause');
});
document.getElementById('ai-restart').addEventListener('click', ()=>{
  if(window.__ns){ AI.grow=0; AI.lastScore=0; AI.lastHeads=''; AI.lastSplit=false; window.__ns.start(); }
});
setInterval(aiPoll, 15);
setTimeout(()=>{ if(window.__ns && window.__ns.mode==='menu' && !AI.paused) window.__ns.start(); }, 900);
</script>
